<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <meta
      name="description"
      content="Organiza ideas en equipo: grupos y pizarras con notas, listas, tablas e imágenes en tiempo real. Inicia sesión con Google."
    />
    <link rel="canonical" href="https://organyzer.web.app/" />

    <!-- Link previews (WhatsApp, Telegram, Slack, X, Facebook...) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Organyzer" />
    <meta property="og:title" content="Organyzer · Organiza ideas en equipo" />
    <meta
      property="og:description"
      content="Grupos y pizarras con notas, listas, tablas e imágenes en tiempo real. Inicia sesión con Google."
    />
    <meta property="og:url" content="https://organyzer.web.app/" />
    <meta property="og:image" content="https://organyzer.web.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo de Organyzer: una O azul con un tilde verde" />
    <meta property="og:locale" content="es_ES" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Organyzer · Organiza ideas en equipo" />
    <meta
      name="twitter:description"
      content="Grupos y pizarras con notas, listas, tablas e imágenes en tiempo real."
    />
    <meta name="twitter:image" content="https://organyzer.web.app/og-image.png" />
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      (function () {
        var saved = localStorage.getItem('organyzer.theme')
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Organyzer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
